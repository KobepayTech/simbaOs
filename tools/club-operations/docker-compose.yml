name: simbaos-club-operations
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simbaos_club_operations
      POSTGRES_USER: simbaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - simbaos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simbaos -d simbaos_club_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      STAFF_DATABASE_URL: postgres://simbaos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/simbaos_club_operations
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${SIMBAOS_PORT:-8080}:8080"

volumes:
  simbaos_db:
